name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/catwar-prototype]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # 깃허브 쪽 일시 오류("Deployment failed, try again later")가 가끔 나서 한 번 더 시도한다
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 30
      - id: deployment
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
